<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cold Call Transcriber</title>
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a24;
    --border: #2a2a3a;
    --text: #e8e8f0;
    --muted: #6b6b8a;
    --accent: #6366f1;
    --s0: #60a5fa;
    --s1: #fb923c;
    --s2: #34d399;
    --s3: #f472b6;
    --red: #ef4444;
    --green: #22c55e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .logo { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
  .logo span { color: var(--accent); }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .api-key-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0 10px;
  }

  .api-key-wrap label {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  .api-key-input {
    background: transparent;
    border: none;
    padding: 9px 4px;
    color: var(--text);
    font-size: 13px;
    width: 230px;
    outline: none;
  }

  select.lang-select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    color: var(--text);
    font-size: 13px;
    outline: none;
    cursor: pointer;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 18px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, background 0.15s;
    white-space: nowrap;
  }
  .btn:hover { opacity: 0.88; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-primary { background: var(--accent); color: #fff; }
  .btn-stop { background: var(--red); color: #fff; animation: pulse-btn 1.4s infinite; }
  .btn-ghost {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    font-size: 12px;
    padding: 6px 12px;
  }

  @keyframes pulse-btn {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); }
    50% { box-shadow: 0 0 0 6px rgba(239,68,68,0); }
  }

  .rec-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }

  .status-bar {
    padding: 7px 24px;
    font-size: 12px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .status-dot.live { background: var(--green); animation: pulse-dot 1s infinite; }
  .status-dot.err  { background: var(--red); }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .names-bar {
    padding: 10px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    font-size: 12px;
  }

  .names-bar-label { color: var(--muted); }

  .name-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .name-color {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .name-input {
    background: transparent;
    border: none;
    border-bottom: 1px dashed var(--border);
    color: var(--text);
    font-size: 12px;
    padding: 1px 4px;
    width: 90px;
    outline: none;
    transition: border-color 0.2s;
  }
  .name-input:focus { border-color: var(--accent); }

  main {
    flex: 1;
    padding: 20px 24px;
    max-width: 920px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .transcript-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .transcript-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .toolbar-actions { display: flex; gap: 8px; }

  .transcript-box {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px;
    min-height: 420px;
    max-height: calc(100vh - 300px);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
    scroll-behavior: smooth;
  }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--muted);
    text-align: center;
    line-height: 1.6;
  }

  .empty-icon { font-size: 44px; opacity: 0.25; }

  .turn { display: flex; flex-direction: column; gap: 5px; }

  .turn-header {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .turn-badge {
    padding: 2px 9px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }

  .turn-time {
    font-size: 11px;
    color: var(--muted);
  }

  .turn-text {
    font-size: 16px;
    line-height: 1.65;
    padding: 10px 14px;
    border-radius: 8px;
    border-left: 3px solid;
    background: rgba(255,255,255,0.02);
  }

  .turn-text.interim {
    color: var(--muted);
    font-style: italic;
  }

  .sp-0 .turn-badge { background: rgba(96,165,250,.15); color: var(--s0); }
  .sp-0 .turn-text  { border-color: var(--s0); }
  .sp-1 .turn-badge { background: rgba(251,146,60,.15); color: var(--s1); }
  .sp-1 .turn-text  { border-color: var(--s1); }
  .sp-2 .turn-badge { background: rgba(52,211,153,.15); color: var(--s2); }
  .sp-2 .turn-text  { border-color: var(--s2); }
  .sp-3 .turn-badge { background: rgba(244,114,182,.15); color: var(--s3); }
  .sp-3 .turn-text  { border-color: var(--s3); }

  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #27272f;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 13px;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.25s;
    pointer-events: none;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  .transcript-box::-webkit-scrollbar { width: 5px; }
  .transcript-box::-webkit-scrollbar-track { background: transparent; }
  .transcript-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="logo">Cold Call <span>Transcriber</span></div>
  <div class="header-controls">
    <div class="api-key-wrap">
      <label for="apiKey">Deepgram Key</label>
      <input type="password" id="apiKey" class="api-key-input" placeholder="dg_..." autocomplete="off" />
    </div>
    <select class="lang-select" id="langSelect">
      <option value="it">🇮🇹 Italiano</option>
      <option value="en">🇬🇧 English</option>
      <option value="es">🇪🇸 Español</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="de">🇩🇪 Deutsch</option>
    </select>
    <button class="btn btn-primary" id="mainBtn" onclick="toggleRecording()">
      <div class="rec-dot"></div>
      <span id="mainBtnLabel">Inizia</span>
    </button>
  </div>
</header>

<div class="status-bar">
  <div class="status-dot" id="statusDot"></div>
  <span id="statusText">Pronto — inserisci la API key Deepgram e premi Inizia</span>
  <span id="timer" style="margin-left:auto; font-variant-numeric: tabular-nums;"></span>
</div>

<div class="names-bar">
  <span class="names-bar-label">Rinomina:</span>
  <div class="name-item">
    <div class="name-color" style="background:var(--s0)"></div>
    <input class="name-input" id="name0" placeholder="Speaker 1" oninput="saveNames(); renderAll()" />
  </div>
  <div class="name-item">
    <div class="name-color" style="background:var(--s1)"></div>
    <input class="name-input" id="name1" placeholder="Speaker 2" oninput="saveNames(); renderAll()" />
  </div>
  <div class="name-item">
    <div class="name-color" style="background:var(--s2)"></div>
    <input class="name-input" id="name2" placeholder="Speaker 3" oninput="saveNames(); renderAll()" />
  </div>
  <div class="name-item">
    <div class="name-color" style="background:var(--s3)"></div>
    <input class="name-input" id="name3" placeholder="Speaker 4" oninput="saveNames(); renderAll()" />
  </div>
</div>

<main>
  <div class="transcript-toolbar">
    <div class="transcript-label">Trascrizione in tempo reale</div>
    <div class="toolbar-actions">
      <button class="btn btn-ghost" onclick="copyTranscript()">Copia testo</button>
      <button class="btn btn-ghost" onclick="exportTxt()">Esporta .txt</button>
      <button class="btn btn-ghost" onclick="clearAll()">Pulisci</button>
    </div>
  </div>

  <div class="transcript-box" id="box">
    <div class="empty-state" id="empty">
      <div class="empty-icon">🎙️</div>
      <div>Nessuna trascrizione.<br>Premi <strong>Inizia</strong>, metti il telefono in vivavoce<br>e parla — trascriverà ogni parola in tempo reale.</div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
let socket = null;
let audioCtx = null;
let processor = null;
let micSource = null;
let micStream = null;
let recording = false;
let recStart = null;
let timerInterval = null;
let turns = [];
let interimSpeaker = 0;
let interimText = '';

function loadPrefs() {
  const key = localStorage.getItem('dg_key');
  if (key) document.getElementById('apiKey').value = key;
  const lang = localStorage.getItem('dg_lang');
  if (lang) document.getElementById('langSelect').value = lang;
  for (let i = 0; i < 4; i++) {
    const n = localStorage.getItem(`sp_name_${i}`);
    if (n) document.getElementById(`name${i}`).value = n;
  }
}

function saveNames() {
  for (let i = 0; i < 4; i++) {
    localStorage.setItem(`sp_name_${i}`, document.getElementById(`name${i}`).value);
  }
}

function getName(idx) {
  const v = document.getElementById(`name${Math.min(idx, 3)}`)?.value.trim();
  return v || `Speaker ${idx + 1}`;
}

function toggleRecording() {
  recording ? stopRecording() : startRecording();
}

async function startRecording() {
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) { toast('Inserisci prima la Deepgram API Key!'); return; }
  localStorage.setItem('dg_key', apiKey);
  localStorage.setItem('dg_lang', document.getElementById('langSelect').value);

  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  } catch (e) {
    setStatus('Microfono non disponibile: ' + e.message, 'err');
    return;
  }

  const lang = document.getElementById('langSelect').value;
  const params = new URLSearchParams({
    model: 'nova-2',
    language: lang,
    diarize: 'true',
    punctuate: 'true',
    smart_format: 'true',
    interim_results: 'true',
    utterance_end_ms: '1200',
    encoding: 'linear16',
    sample_rate: '16000',
    channels: '1',
  });

  socket = new WebSocket(`wss://api.deepgram.com/v1/listen?${params}`, ['token', apiKey]);
  socket.binaryType = 'arraybuffer';

  socket.onopen = () => {
    recording = true;
    recStart = Date.now();
    setStatus('Connesso — registrazione in corso...', 'live');
    setBtnStop();
    startTimer();
    startAudio();
  };

  socket.onmessage = (ev) => {
    let data;
    try { data = JSON.parse(ev.data); } catch { return; }
    if (data.type !== 'Results') return;
    const alt = data.channel?.alternatives?.[0];
    if (!alt || !alt.transcript) return;
    const words = alt.words || [];
    const spk = words.length > 0 ? (words[0].speaker ?? 0) : 0;
    if (data.is_final) {
      if (alt.transcript.trim()) pushTurn(spk, alt.transcript.trim(), data.start ?? 0);
      interimText = '';
      renderAll();
    } else {
      interimSpeaker = spk;
      interimText = alt.transcript.trim();
      renderAll();
    }
  };

  socket.onerror = () => setStatus('Errore connessione Deepgram', 'err');
  socket.onclose = (ev) => {
    if (recording) {
      setStatus(`Connessione chiusa (${ev.code})`, 'err');
      stopRecording();
    }
  };
}

function startAudio() {
  audioCtx = new AudioContext({ sampleRate: 16000 });
  micSource = audioCtx.createMediaStreamSource(micStream);
  processor = audioCtx.createScriptProcessor(4096, 1, 1);
  processor.onaudioprocess = (e) => {
    if (!recording || socket?.readyState !== WebSocket.OPEN) return;
    const f32 = e.inputBuffer.getChannelData(0);
    const i16 = new Int16Array(f32.length);
    for (let i = 0; i < f32.length; i++) {
      const s = Math.max(-1, Math.min(1, f32[i]));
      i16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    socket.send(i16.buffer);
  };
  micSource.connect(processor);
  processor.connect(audioCtx.destination);
}

function stopRecording() {
  recording = false;
  clearInterval(timerInterval);
  document.getElementById('timer').textContent = '';
  try { micSource?.disconnect(); } catch {}
  try { processor?.disconnect(); } catch {}
  try { audioCtx?.close(); } catch {}
  try { micStream?.getTracks().forEach(t => t.stop()); } catch {}
  try { if (socket?.readyState === WebSocket.OPEN) socket.close(); } catch {}
  setStatus('Registrazione terminata');
  setBtnStart();
}

function startTimer() {
  timerInterval = setInterval(() => {
    const s = Math.floor((Date.now() - recStart) / 1000);
    const mm = String(Math.floor(s / 60)).padStart(2, '0');
    const ss = String(s % 60).padStart(2, '0');
    document.getElementById('timer').textContent = `${mm}:${ss}`;
  }, 500);
}

function pushTurn(speaker, text, startSec) {
  const last = turns[turns.length - 1];
  if (last && last.speaker === speaker) {
    last.text += ' ' + text;
  } else {
    turns.push({ speaker, text, startSec });
  }
}

function renderAll() {
  const box = document.getElementById('box');
  const empty = document.getElementById('empty');
  if (turns.length === 0 && !interimText) {
    empty.style.display = 'flex';
    box.innerHTML = '';
    box.appendChild(empty);
    return;
  }
  empty.style.display = 'none';
  box.innerHTML = '';
  turns.forEach(t => box.appendChild(makeTurnEl(t.speaker, t.text, t.startSec, false)));
  if (interimText) box.appendChild(makeTurnEl(interimSpeaker, interimText + '...', null, true));
  box.scrollTop = box.scrollHeight;
}

function makeTurnEl(speaker, text, startSec, isInterim) {
  const div = document.createElement('div');
  div.className = `turn sp-${Math.min(speaker, 3)}`;
  const header = document.createElement('div');
  header.className = 'turn-header';
  const badge = document.createElement('span');
  badge.className = 'turn-badge';
  badge.textContent = getName(speaker);
  header.appendChild(badge);
  if (startSec !== null) {
    const t = document.createElement('span');
    t.className = 'turn-time';
    t.textContent = fmtTime(startSec);
    header.appendChild(t);
  }
  const body = document.createElement('div');
  body.className = 'turn-text' + (isInterim ? ' interim' : '');
  body.textContent = text;
  div.appendChild(header);
  div.appendChild(body);
  return div;
}

function fmtTime(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, '0');
  const s = String(Math.floor(sec % 60)).padStart(2, '0');
  return `${m}:${s}`;
}

function getPlainText() {
  return turns.map(t => `[${fmtTime(t.startSec)}] ${getName(t.speaker)}: ${t.text}`).join('\n\n');
}

function copyTranscript() {
  if (!turns.length) { toast('Nessuna trascrizione da copiare'); return; }
  navigator.clipboard.writeText(getPlainText()).then(() => toast('Copiato negli appunti!'));
}

function exportTxt() {
  if (!turns.length) { toast('Nessuna trascrizione da esportare'); return; }
  const date = new Date().toISOString().slice(0, 16).replace('T', '_').replace(':', '-');
  const blob = new Blob([getPlainText()], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `trascrizione_${date}.txt`;
  a.click();
}

function clearAll() {
  if (turns.length && !confirm('Eliminare la trascrizione corrente?')) return;
  turns = [];
  interimText = '';
  renderAll();
}

function setStatus(msg, state) {
  document.getElementById('statusText').textContent = msg;
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot' + (state ? ` ${state}` : '');
}

function setBtnStop() {
  document.getElementById('mainBtn').className = 'btn btn-stop';
  document.getElementById('mainBtnLabel').textContent = 'Stop';
}

function setBtnStart() {
  document.getElementById('mainBtn').className = 'btn btn-primary';
  document.getElementById('mainBtnLabel').textContent = 'Inizia';
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2800);
}

loadPrefs();
</script>
</body>
</html>
